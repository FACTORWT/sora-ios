name: Build SORA iOS

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci || npm install

      - name: Write ASC API key
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          mkdir -p "$HOME/private_keys"
          printf '%s' "$ASC_KEY_P8" > "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          chmod 600 "$HOME/private_keys/AuthKey_$ASC_KEY_ID.p8"
          printf '{"key_id":"%s","issuer_id":"%s","key_filepath":"%s/private_keys/AuthKey_%s.p8","in_house":false}' "$ASC_KEY_ID" "$ASC_ISSUER_ID" "$HOME" "$ASC_KEY_ID" > "$HOME/asc_key.json"
          wc -c "$HOME/asc_key.json"

      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Signing profile
        run: |
          fastlane run get_provisioning_profile app_identifier:"com.soradestiny.app" team_id:"D695835P4T" api_key_path:"$HOME/asc_key.json" output_path:"$RUNNER_TEMP/profile" skip_certificate_verification:false || true
          ls -la "$RUNNER_TEMP/profile" || true

      - name: Build and export IPA
        run: |
          fastlane gym --workspace ios/App/App.xcworkspace --scheme App --configuration Release --export_method app-store --output_directory "$RUNNER_TEMP/out" --buildlog_path "$RUNNER_TEMP/logs" --api_key_path "$HOME/asc_key.json" --xcargs "-allowProvisioningUpdates"

      - name: Keep IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: warn

      - name: Upload to App Store Connect
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          IPA=$(find "$RUNNER_TEMP/out" -name "*.ipa" | head -1)
          echo "IPA: $IPA"
          xcrun altool --upload-app -f "$IPA" -t ios --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"
