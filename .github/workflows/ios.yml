name: Build SORA iOS

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sora-ios-build
  cancel-in-progress: false

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install JS deps
        run: npm ci || npm install

      - name: Quitar plugin RevenueCat
        run: npm remove @revenuecat/purchases-capacitor --no-audit --no-fund || true

      - name: Write ASC API key
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          python3 scripts/asc_key.py
      - name: Capacitor sync iOS
        run: npx cap sync ios

      - name: Validar Info.plist
        run: |
          if ! plutil -lint ios/App/App/Info.plist; then
            echo "Info.plist invalido tras cap sync, restaurando el del repositorio"
            git checkout -- ios/App/App/Info.plist
            plutil -lint ios/App/App/Info.plist
          fi

      - name: Pod install
        run: |
          cd ios/App
          pod install --repo-update

      - name: Install fastlane
        run: gem install fastlane --no-document

      - name: Signing profile
        run: |
          fastlane run get_provisioning_profile app_identifier:"com.soradestiny.app" team_id:"D695835P4T" api_key_path:"$HOME/asc_key.json" output_path:"$RUNNER_TEMP/profile" skip_certificate_verification:false || true
          ls -la "$RUNNER_TEMP/profile" || true

      - name: Build and upload
        timeout-minutes: 35
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          P12_PASSWORD: ${{ secrets.P12_PASSWORD }}
        run: fastlane beta

      - name: Guardar certificado para reutilizar
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: certificados-distribucion
          path: ${{ runner.temp }}/certs
          if-no-files-found: warn

      - name: Keep IPA
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: sora-ipa
          path: ${{ runner.temp }}/out/*.ipa
          if-no-files-found: warn

