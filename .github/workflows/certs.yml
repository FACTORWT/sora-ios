name: Listar certificados iOS
on:
  workflow_dispatch:
jobs:
  certs:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Escribir llave de la API
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          mkdir -p ~/private_keys
          printf '%s' "$ASC_KEY_P8" > ~/private_keys/AuthKey_$ASC_KEY_ID.p8
          chmod 600 ~/private_keys/AuthKey_$ASC_KEY_ID.p8
      - name: Instalar fastlane
        run: gem install fastlane --no-document
      - name: Listar
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: ruby scripts/list_certs.rb
